apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pikadns.fullname" . }}
  labels:
    {{- include "pikadns.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "pikadns.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pikadns.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: pikadns
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PIKA_BASE
              value: {{ required "baseDomain is required" .Values.baseDomain | quote }}
            - name: CF_ZONE_ID
              value: {{ required "cloudflare.zoneId is required" .Values.cloudflare.zoneId | quote }}
            - name: TTL
              value: {{ .Values.recordTtl | quote }}
            - name: CF_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "pikadns.secretName" . }}
                  key: {{ include "pikadns.secretKey" . }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
