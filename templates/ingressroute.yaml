{{- if .Values.ingressRoute.enabled }}
{{- $match := .Values.ingressRoute.match | default (printf "HostRegexp(`^.+\\.%s$`)" (.Values.baseDomain | replace "." "\\.")) }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "pikadns.fullname" . }}
  labels:
    {{- include "pikadns.labels" . | nindent 4 }}
spec:
  entryPoints:
    {{- toYaml .Values.ingressRoute.entryPoints | nindent 4 }}
  routes:
    - kind: Rule
      match: {{ $match | quote }}
      services:
        - name: {{ include "pikadns.fullname" . }}
          port: {{ .Values.service.port }}
  {{- with .Values.ingressRoute.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
